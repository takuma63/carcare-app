<!doctype html><meta charset="utf-8">
<!-- 店頭用ポスター（A4縦）。App Store の紹介画像（frame.html）と同じ世界観にそろえている。
     puppeteer で開いて PDF / PNG にする（store/poster/ に出力）。
     ストアのバッジは各社の公式配布物（store/badges/）。形や色を加工しないこと -->
<style>
  @page { size: A4; margin: 0; }
  :root { --bg:#1a1a1a; --band:#222120; --gold:#c4a24a; --ink:#ffffff; --sub:#d6cfbf; --line:#3b3a36; }
  html,body { margin:0; background:var(--bg); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sheet { position:relative; width:210mm; height:297mm; overflow:hidden; background:var(--bg);
           font-family:"Noto Sans JP","Hiragino Sans",sans-serif; }

  /* ロゴは黒字のPNGなので、反転して背景になじませる */
  .logo { position:absolute; top:12mm; left:50%; transform:translateX(-50%); width:34mm;
          filter:invert(1); mix-blend-mode:screen; }

  .text { position:absolute; top:36mm; left:0; right:0; text-align:center; }
  .eyebrow { font-family:"Baskerville","Didot",serif; font-size:12pt; letter-spacing:.42em; color:var(--gold); padding-left:.42em; }
  .rule { width:10mm; height:.3mm; background:var(--gold); margin:3.5mm auto 5mm; }
  h1 { margin:0; font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro",serif; font-weight:600; color:var(--ink);
       font-size:37pt; line-height:1.38; letter-spacing:.06em; }
  .lead { margin:5.5mm 0 0; font-size:14pt; font-weight:400; line-height:1.75; color:var(--sub); letter-spacing:.04em; }

  .phone { position:absolute; width:76mm; border-radius:10mm; overflow:hidden; background:#fff;
           border:.4mm solid var(--line); box-shadow:0 0 0 2mm #232220; }
  .phone img { display:block; width:100%; }
  .phone--back { top:117mm; left:calc(50% + 3mm); }
  .phone--front { top:117mm; right:calc(50% + 3mm); }

  .band { position:absolute; left:0; right:0; bottom:0; height:82mm; background:var(--band);
          border-top:.3mm solid var(--gold); display:flex; align-items:center; justify-content:center; gap:10mm; }
  .qr { width:54mm; height:54mm; background:#fff; padding:1mm; box-sizing:border-box; }
  .qr img { display:block; width:100%; height:100%; }
  .cta h2 { margin:0; font-family:"Hiragino Mincho ProN",serif; font-weight:600; color:var(--ink);
            font-size:24pt; line-height:1.4; letter-spacing:.06em; }
  .cta p { margin:3.5mm 0 0; font-size:12.5pt; font-weight:400; line-height:1.75; color:var(--sub); letter-spacing:.03em; }
  .badges { display:flex; align-items:center; gap:3mm; margin-top:5.5mm; }
  .badges .as { height:13mm; display:block; }
  /* Google の PNG は周りに余白を含むので、見た目の高さを App Store にそろえる */
  .badges .gp { height:19.2mm; display:block; margin:-3.1mm -2.8mm; }
</style>
<div class="sheet">
  <img class="logo" src="../../../carcare-reservation/images/logo.png" alt="CARCARE CENTER">

  <div class="text">
    <div class="eyebrow">OFFICIAL APP</div><div class="rule"></div>
    <h1>カーケアセンター<br>公式アプリ</h1>
    <p class="lead">ご予約、お車の登録、回数券の残高をスマートフォンひとつで。<br>最上級の洗車をより手軽に。</p>
  </div>

  <div class="phone phone--back"><img src="raw/s2-calendar.png" alt=""></div>
  <div class="phone phone--front"><img src="raw/s1-home.png" alt=""></div>

  <div class="band">
    <div class="qr"><img src="qr/app-qr-tight.svg" alt="QRコード"></div>
    <div class="cta">
      <h2>ダウンロードはこちら</h2>
      <p>ご利用は無料です。<br>iPhone・Android どちらにも対応しています。</p>
      <div class="badges">
        <img class="as" src="badges/app-store.svg" alt="App Store からダウンロード">
        <img class="gp" src="badges/google-play.png" alt="Google Play で手に入れよう">
      </div>
    </div>
  </div>
</div>
